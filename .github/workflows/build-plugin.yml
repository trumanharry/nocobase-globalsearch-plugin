name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nocobase_version:
        description: create-nocobase-app npm version used for the build toolchain
        required: true
        default: '2.2.47'
      create_release:
        description: Create or update a GitHub Release with the tarball
        type: boolean
        default: true

concurrency:
  group: build-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOCOBASE_VERSION: ${{ github.event.inputs.nocobase_version || '2.2.47' }}
      APP_DIR: ${{ github.workspace }}/ci-app
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Read plugin version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      - name: Build plugin with create-nocobase-app
        run: bash scripts/ci-build.sh

      - name: Upload plugin tarball
        uses: actions/upload-artifact@v4
        with:
          name: plugin-global-search-${{ steps.version.outputs.value }}
          path: release/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Global Search v${{ steps.version.outputs.value }}
          files: release/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
